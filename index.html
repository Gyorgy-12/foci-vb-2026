<!doctype html><html lang="hu"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>FIFA World Cup 2026</title><style>
/* â”€â”€ CSS VARIABLES â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
:root{
  --bg:#05090b; --surface:#0f161a; --surface2:#151d23; --surface3:#1c2530;
  --hdr1:#4b0008; --hdr2:#2e0005;
  --text:#e8edf0; --muted:#7e8c96; --muted2:#a4b0b8;
  --green:#28d16c; --blue:#6ec6ff; --cyan:#17ceca; --aqua:#7ee8ea;
  --orange:#f59500; --red:#f04050; --el:#e8a020;
  --logo:clamp(19px,4.7vw,25px);
  --row-h:clamp(40px,9.5vw,52px);
  --card-r:clamp(12px,3.2vw,18px);
  --pp:clamp(10px,3vw,15px);
  --cp:clamp(10px,2.6vw,16px);
  --fz-xs:clamp(8px,1.95vw,10px);
  --fz-sm:clamp(9px,2.2vw,11px);
  --fz-md:clamp(11px,2.7vw,13px);
  --fz-lg:clamp(13px,3.2vw,16px);
  --fz-title:clamp(14px,3.5vw,17px);
  --fz-ht:clamp(13px,3.2vw,16px);
  --fz-sz:clamp(22px,5.6vw,30px);
  --page-max:720px;
  --top-h:148px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:500;overflow-x:hidden;
}
.app{min-height:100vh}

/* â”€â”€ TOPBAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.top{
  position:fixed;inset:0 0 auto;z-index:9999;
  background:linear-gradient(175deg,#6b000e 0%,#480007 40%,#2e0005 100%);
  border-bottom:1px solid #1a2228;
  will-change:contents;
}
.top.shrunken .hdr{height:clamp(60px,15vw,76px);padding-top:clamp(7px,1.8vw,10px)}
.top.shrunken .li-box{width:clamp(30px,7.5vw,38px);height:clamp(30px,7.5vw,38px)}
.top.shrunken .li-title{font-size:clamp(10px,2.5vw,12.5px)}
.top.shrunken .li-season{font-size:clamp(17px,4.3vw,22px)}
.top.shrunken .tabs{height:clamp(36px,8.8vw,44px)}
.top.shrunken .tab{font-size:clamp(11px,2.7vw,13.5px);padding-bottom:clamp(6px,1.5vw,9px)}
.hdr{
  height:clamp(88px,21vw,116px);
  padding:clamp(12px,3vw,18px) var(--pp) clamp(6px,1.5vw,10px);
  display:flex;align-items:flex-start;gap:clamp(9px,2.5vw,14px);
  transition:height .2s,padding-top .2s;
}
.hdr-back{width:clamp(24px,6vw,30px);height:clamp(24px,6vw,30px);display:grid;place-items:center;color:#fff;font-size:clamp(18px,4.5vw,24px);flex:0 0 auto;padding-top:2px}
.li-box{
  width:clamp(38px,9.2vw,50px);height:clamp(38px,9.2vw,50px);
  border-radius:clamp(7px,1.8vw,10px);background:#0e1f27;
  padding:clamp(4px,1.1vw,6px);flex:0 0 auto;overflow:hidden;
  display:grid;place-items:center;
  transition:width .2s,height .2s;
}
.li-box img,.li-box svg{width:100%;height:100%;object-fit:contain;object-position:center;display:block}
.li-box .li-fb{display:none}
.li-box.bad img{display:none}.li-box.bad .li-fb{display:block}
.li-info{flex:1;min-width:0;padding-top:clamp(1px,.5vw,3px)}
.li-title{font-size:var(--fz-ht);font-weight:700;line-height:1.05;white-space:nowrap;transition:font-size .2s}
.li-season{font-size:var(--fz-sz);font-weight:400;line-height:1;margin-top:1px;white-space:nowrap;letter-spacing:.02em;transition:font-size .2s}
.li-season .chev{font-size:.42em;vertical-align:middle;margin-left:clamp(3px,1vw,6px)}
.hdr-acts{display:flex;gap:clamp(7px,2vw,12px);align-items:center;margin-left:auto;padding-top:2px}
.hdr-icon{width:clamp(22px,5.5vw,28px);height:clamp(22px,5.5vw,28px);display:grid;place-items:center;font-size:clamp(16px,4vw,20px);color:#dde4e8}
.tabs{
  display:flex;overflow-x:auto;scrollbar-width:none;
  padding:0 var(--pp);
  justify-content:flex-start;height:clamp(42px,10vw,52px);align-items:flex-end;
  gap:clamp(22px,6vw,44px);transition:height .2s;
  justify-content:flex-start;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:transparent;color:#8a969f;
  font-size:clamp(12px,3vw,15px);font-weight:600;
  padding:0 1px clamp(9px,2.2vw,12px);position:relative;white-space:nowrap;flex:0 0 auto;
  cursor:pointer;transition:font-size .2s,padding-bottom .2s;
}
.tab.active{color:#edf0f2;font-weight:700}
.tab.active::after{content:"";position:absolute;inset:auto 0 0;height:2.5px;background:#fff;border-radius:2px}

/* â”€â”€ FILTER / CONTROLS BARS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.ctrl-bar{background:#0d1419;border-bottom:1px solid #1c2730;position:sticky;top:var(--top-h,148px);z-index:100}
.kc-bar{background:#0d1419;border-bottom:1px solid #1c2730;position:sticky;top:var(--top-h,148px);z-index:100}
.ctrl-inner{max-width:var(--page-max);margin:0 auto;display:flex;align-items:center;gap:clamp(5px,1.6vw,9px);padding:clamp(6px,1.7vw,10px) var(--pp)}
.pill{
  border:0;border-radius:999px;cursor:pointer;white-space:nowrap;
  font-size:clamp(10.5px,2.65vw,12.5px);font-weight:700;
  padding:clamp(5px,1.4vw,7px) clamp(12px,3.2vw,17px);
  background:#131c22;color:#c8d2d8;
  transition:background .15s,color .15s;
}
.pill.active{background:#e8edf0;color:#0d1216}
.view-wrap{margin-left:auto;position:relative;z-index:60}
.view-btn{
  width:clamp(36px,9.5vw,46px);height:clamp(30px,8vw,38px);
  border-radius:clamp(8px,2vw,11px);border:0;background:#131c22;
  color:#c8d2d8;display:grid;place-items:center;cursor:pointer;
}
.hbars{width:46%;height:44%;position:relative}
.hbars::before,.hbars::after,.hbars i{content:"";position:absolute;left:0;right:0;height:2.5px;border-radius:2px;background:#b8c4cc}
.hbars::before{top:0}.hbars i{top:50%;transform:translateY(-50%)}.hbars::after{bottom:0}
.hbars b{position:absolute;right:-3px;bottom:-2px;border:4.5px solid transparent;border-top-color:#b8c4cc;border-bottom:0}
/* dropdown menu */
.drop{
  display:none;position:absolute;right:0;top:calc(100% + 5px);
  min-width:clamp(120px,32vw,160px);background:#1c2730;
  border-radius:10px;overflow:hidden;z-index:500;box-shadow:0 10px 28px rgba(0,0,0,.45);
}
.drop.open{display:block}
.drop button{
  width:100%;border:0;background:transparent;color:#d4dde2;text-align:left;
  font-size:clamp(11.5px,2.9vw,13.5px);font-weight:600;
  padding:clamp(9px,2.4vw,12px) clamp(14px,3.5vw,18px);cursor:pointer;
}
.drop button:hover{background:#242f38}
.drop button.active{color:#9ba7ff;background:#0e151b}
/* knockout selector */
/* kc-bar handled above */
.kc-inner{max-width:var(--page-max);margin:0 auto;display:flex;align-items:center;gap:clamp(6px,1.8vw,10px);padding:clamp(6px,1.7vw,10px) var(--pp)}
.sel-wrap{position:relative;min-width:0;flex:1;z-index:60}
.sel-btn{
  width:100%;border:1px solid #2a363f;border-radius:8px;background:#111a1f;color:#d0d9de;
  font-size:clamp(11px,2.8vw,13px);font-weight:500;
  padding:clamp(5px,1.5vw,8px) clamp(9px,2.4vw,12px);
  display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;
}
.sel-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1}
.sel-chev{flex:0 0 auto;background:#090f12;border-radius:5px;padding:2px 6px;font-size:.75em;color:#8a969f}
.sel-drop{right:auto;left:0;min-width:min(280px,calc(100vw - 36px))}
.expand-btn{flex:0 0 auto;background:#131c22;border:0;border-radius:8px;width:clamp(34px,9vw,42px);height:clamp(28px,7.5vw,34px);color:#c8d2d8;font-size:18px;cursor:pointer;display:grid;place-items:center}

/* â”€â”€ MAIN CONTENT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.main{max-width:var(--page-max);margin:0 auto;padding:clamp(10px,2.6vw,14px) var(--pp) 64px}
.hidden{display:none!important}

/* â”€â”€ TABLE CARDS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.card{
  background:var(--surface);border-radius:var(--card-r);
  padding:var(--cp);margin-bottom:clamp(9px,2.4vw,14px);
  /* subtle inner border like SofaScore */
  box-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.025);
}
.card-title{font-size:var(--fz-title);font-weight:700;margin-bottom:clamp(8px,2vw,12px);color:#dde4e8}

/* â”€â”€ TABLE GRID â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
/* SofaScore short: rank | team(logo+name) | P | GD | PTS */
.grid{display:grid;align-items:center}
.short{
  grid-template-columns:
    clamp(18px,4.6vw,24px)   /* rank */
    minmax(0,1fr)              /* team */
    clamp(24px,6vw,30px)      /* P */
    clamp(34px,8.2vw,42px)    /* GD */
    clamp(34px,8.2vw,42px);   /* PTS */
  column-gap:clamp(4px,1.2vw,8px);
}
.full{
  grid-template-columns:
    clamp(18px,4.6vw,24px)
    minmax(0,1fr)
    repeat(4,clamp(22px,5.4vw,27px))
    clamp(38px,9vw,48px)
    clamp(30px,7.4vw,38px);
  column-gap:clamp(3px,1vw,6px);
}
.formv{
  grid-template-columns:
    clamp(18px,4.6vw,24px)
    minmax(0,1fr)
    clamp(110px,30vw,165px)
    clamp(30px,7.4vw,38px);
  column-gap:clamp(4px,1.2vw,8px);
}
/* header row */
.thead{
  color:var(--muted);font-size:var(--fz-xs);font-weight:700;
  min-height:clamp(16px,3.8vw,21px);margin-bottom:2px;
}
.thead>div{text-align:center}
.thead>div:nth-child(1),.thead>div:nth-child(2),.thead .th-team{text-align:left;padding-left:0}
/* data rows */
.row{
  height:var(--row-h);font-size:var(--fz-md);font-weight:600;
  color:#d8dfe4;align-items:center;
  border-top:1px solid rgba(255,255,255,.04);
}
.row:first-of-type{border-top:0}
.rank{color:#c0cad1;text-align:center;font-size:var(--fz-md);font-variant-numeric:tabular-nums;font-weight:700}
.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
/* team cell */
.tc{min-width:0;display:flex;align-items:center;gap:clamp(7px,1.9vw,10px)}
.tname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* â”€â”€ CLUB CRESTS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.crest{
  --cs:var(--logo);
  width:var(--cs);height:var(--cs);min-width:var(--cs);max-width:var(--cs);
  flex:0 0 var(--cs);position:relative;overflow:visible;
  display:inline-flex;align-items:center;justify-content:center;align-self:center;
  background:transparent;border-radius:0;vertical-align:middle;
}
.crest img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center;
  transform:none;transform-origin:center;
  display:block;
  image-rendering:auto;
}
/* svg inline fallback */
.crest .svg-fb{
  position:absolute;inset:0;width:100%;height:100%;
  display:none;align-items:center;justify-content:center;
}
.crest .svg-fb svg{width:80%;height:80%;display:block}
/* initials text fallback */
.crest .ini-fb{
  display:none;font-size:calc(var(--cs)*.32);font-weight:800;
  color:#cdd6dc;text-align:center;line-height:1;letter-spacing:-.02em;
  font-family:-apple-system,sans-serif;
}
/* states */
.crest.has-svg img{display:block} /* img still tries first */
.crest.show-svg img{display:none!important}
.crest.show-svg .svg-fb{display:flex}
.crest.show-ini img{display:none!important}
.crest.show-ini .svg-fb{display:none!important}
.crest.show-ini{border-radius:50%;background:#1a2832;overflow:hidden}
.crest.show-ini .ini-fb{display:block}

/* â”€â”€ QUALIFICATION ZONE LINES â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
/*
  SofaScore style: a vertical bar on the far left of the card,
  with a tiny horizontal top-hook and bottom-hook pointing right.
  The bar spans exactly from the first row's vertical centre
  to the last row's vertical centre.
  Each zone is a separate coloured segment with a small gap between.
*/
.standings{display:flex;flex-direction:column;gap:0}
.zone{position:relative;padding-left:0}
/* coloured bracket line */
.zone.zl{
  --zc:var(--green);
  padding-left:0;
}
.zone.zl::before{
  content:"";
  position:absolute;
  left:calc(0px - var(--cp));
  top:calc(clamp(6px,1.6vw,9px));
  bottom:0;
  border-left:2.5px solid var(--zc);
  border-top:2.5px solid var(--zc);
  border-bottom:2.5px solid var(--zc);
  border-right:0;
  width:clamp(9px,2.6vw,13px);
  background:transparent;
  pointer-events:none;z-index:1;
}
/* Összeforrasztás: egymás utáni azonos színű zone-ok */
/* Az első: van felső horog, nincs alsó */
.zone.zl.zl-first::before{
  border-bottom:0;
  bottom:calc(-1 * clamp(8px,2.2vw,13px));  /* átnyúlik a következőbe */
}
/* Középső: nincs felső, nincs alsó horog, átnyúlik mindkét irányba */
.zone.zl.zl-mid::before{
  border-top:0;
  border-bottom:0;
  top:calc(-1 * clamp(8px,2.2vw,13px));
  bottom:calc(-1 * clamp(8px,2.2vw,13px));
}
/* Utolsó: nincs felső horog */
.zone.zl.zl-last::before{
  border-top:0;
  top:calc(-1 * clamp(8px,2.2vw,13px));
}
/* Solo: mindkét horog megvan (alapértelmezett, nem kell külön) */
/* Összeforrasztott zone-ok közt nincs margin */
.zone.zl.zl-first + .zone.zl.zl-last,
.zone.zl.zl-first + .zone.zl.zl-mid,
.zone.zl.zl-mid   + .zone.zl.zl-last,
.zone.zl.zl-mid   + .zone.zl.zl-mid{
  margin-top:0!important;
}
/* gap between consecutive zone lines */
.zone.zl+.zone.zl{margin-top:clamp(8px,2.2vw,13px)}
/* zone label */
.zlabel{
  font-size:var(--fz-xs);font-weight:700;color:var(--muted);
  padding-left:clamp(14px,4vw,24px);
  line-height:1.2;
  /* SofaScore: label sits ABOVE its first row, inside the zone */
  padding-top:clamp(6px,1.6vw,9px);
  padding-bottom:clamp(3px,1vw,5px);
}
.zone:first-child .zlabel{padding-top:0}
.updated{
  text-align:right;color:var(--muted2);
  font-size:var(--fz-xs);margin-top:clamp(7px,1.8vw,10px);
}
.rules-row{
  margin-top:clamp(10px,2.6vw,14px);background:#0a1015;border-radius:10px;
  padding:clamp(9px,2.4vw,13px);display:flex;align-items:center;justify-content:space-between;
  font-size:var(--fz-md);font-weight:700;
}
.rules-arr{width:12px;height:12px;border-right:2.5px solid #c0cad1;border-bottom:2.5px solid #c0cad1;transform:rotate(45deg)}

/* â”€â”€ FORM STRIP â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.fstrip{display:flex;justify-content:flex-end}
.fb{
  width:clamp(21px,5.5vw,28px);height:clamp(18px,4.6vw,23px);
  display:grid;place-items:center;
  font-size:clamp(7.5px,1.9vw,9.5px);font-weight:800;color:#060c10;
}
.fb:first-child{border-radius:5px 0 0 5px}.fb:last-child{border-radius:0 5px 5px 0}
.W{background:#1bc872}.D{background:#909aa3}.L{background:#ef4f4f}

/* â”€â”€ KNOCKOUT / BRACKET â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.ko-area{
  background:#000;
  min-height:calc(100vh - var(--top-h) - 48px);
  padding:clamp(16px,4.5vw,28px) var(--pp) 60px;
  overflow:hidden;
  /* centre on wide screens */
  display:flex;flex-direction:column;align-items:stretch;
}
.ko-inner{
  max-width:var(--page-max);
  margin:0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}
/*
  Bracket layout: trophy floats left beside the column of match cards.
  Use a flex row: [trophy] [match-column]
*/
.bracket-row{
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:clamp(10px,3vw,24px);
  width:100%;
  justify-content:center;
}
.btrophy{
  font-size:clamp(40px,11vw,58px);
  flex:0 0 auto;
  /* vertically aligns naturally in flex row */
  align-self:center;
}
/* The vertical column of match boxes */
.bracket-col{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  position:relative;
}
/* Individual match card */
.bmatch{
  width:clamp(154px,42vw,185px);
  background:#141d24;
  border-radius:10px;
  padding:clamp(8px,2.2vw,12px);
  position:relative;
  z-index:2;
}
.bteams{
  display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(4px,1.2vw,7px);align-items:start;
}
.bteam{
  text-align:center;color:#c8d4d9;
  font-size:clamp(9px,2.4vw,11px);font-weight:800;
  display:flex;flex-direction:column;
  align-items:center;gap:clamp(4px,1.1vw,6px);
  overflow:visible;
}
.bteam .crest{--cs:clamp(24px,6.2vw,30px)}
.bteam>span{line-height:1.1;display:block;position:relative;z-index:2}
.bscore{
  text-align:center;font-size:clamp(18px,4.6vw,24px);
  font-weight:500;color:#ccd4d8;margin-top:5px;
  letter-spacing:.06em;font-variant-numeric:tabular-nums;
}
/* Vertical connector line between match cards */
.bcon{
  width:2px;
  background:#1e2e38;
  flex:0 0 auto;
  align-self:center;
  height:clamp(18px,5vw,28px);
}
/* Final result box */
.bmatch.bfinal{
  display:flex;align-items:center;justify-content:center;
  min-height:clamp(50px,12vw,66px);
  color:#b8c4cc;text-align:center;
  font-size:clamp(9.5px,2.5vw,11.5px);font-weight:700;letter-spacing:.01em;
  line-height:1.3;
}
.bwm{
  margin-top:clamp(16px,4.5vw,28px);
  text-align:right;
  width:100%;
  color:#7e8c96;font-size:clamp(11px,3vw,14px);font-weight:700;
}

/* â”€â”€ BARAJ OVERVIEW â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.baraj-area{background:#000;min-height:calc(100vh - var(--top-h) - 48px);padding-bottom:60px}
.baraj-wrap{
  max-width:var(--page-max);margin:0 auto;
  padding:clamp(18px,5vw,30px) var(--pp) 0;
  display:flex;align-items:flex-start;gap:clamp(10px,3vw,18px);
}
.baraj-trophy{font-size:clamp(44px,13.5vw,68px);flex:0 0 auto;padding-top:clamp(4px,1.5vw,10px)}
.baraj-cards{display:flex;flex-direction:column;flex:1;min-width:0;gap:clamp(8px,2.4vw,13px)}
.bpair{
  background:#141d24;border-radius:11px;
  padding:clamp(9px,2.5vw,13px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.5vw,8px);
  border:0;cursor:pointer;width:100%;
  transition:background .15s;
}
.bpair:hover,.bpair:focus-visible{background:#1b2a35;outline:none}
.bpair-teams{display:flex;gap:clamp(14px,4.2vw,24px);align-items:flex-start;justify-content:center}
.bpteam{
  text-align:center;color:#c8d4d9;
  font-size:clamp(9px,2.35vw,11px);font-weight:800;
  display:grid;grid-template-rows:clamp(26px,7vw,32px) auto;
  gap:clamp(4px,1.1vw,6px);align-items:start;justify-items:center;overflow:visible;
}
.bpteam .crest{--cs:clamp(22px,5.8vw,28px);margin:0 auto}
.bpteam span{line-height:1.1;display:block;z-index:2;position:relative}
.bpteam.dim{opacity:.38}
.bpscore{font-size:clamp(18px,4.7vw,24px);font-weight:500;color:#dce4e8;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.baraj-foot{max-width:var(--page-max);margin:clamp(14px,4vw,22px) auto 0;padding:0 var(--pp);display:flex;justify-content:flex-end}
.baraj-wm{color:#7e8c96;font-size:clamp(11px,3vw,14px);font-weight:700}

/* â”€â”€ TIE DETAIL SHEET â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.overlay{
  position:fixed;inset:0;z-index:99990;background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .18s ease;
}
html.modal-open{overflow:hidden!important}
body.modal-open{position:fixed!important;left:0;right:0;width:100%!important;overflow:hidden!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  background:#1c2730;border-radius:16px 16px 0 0;
  width:min(500px,100vw);max-height:82vh;overflow-y:auto;
  padding-bottom:32px;
  animation:slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-top{
  position:sticky;top:0;background:#1c2730;z-index:2;
  padding:10px 14px 4px;display:flex;align-items:center;justify-content:center;
}
.sheet-pill{width:38px;height:4px;background:#334150;border-radius:2px;cursor:pointer}
.sheet-x{
  position:absolute;right:12px;top:9px;
  width:26px;height:26px;border-radius:50%;border:0;
  background:#26343e;color:#8a969f;font-size:15px;
  display:grid;place-items:center;cursor:pointer;
}
.sheet-x:hover{background:#2e3f4c;color:#c0cad1}
.sheet-title{font-size:clamp(13px,3.3vw,16px);font-weight:700;padding:clamp(10px,2.6vw,14px) clamp(14px,3.6vw,18px) clamp(4px,1.2vw,7px)}
/* match entry rows */
.me{
  display:grid;
  grid-template-columns:clamp(50px,13.5vw,66px) 1px 1fr clamp(30px,7.8vw,40px) clamp(28px,7.2vw,36px);
  align-items:stretch;min-height:clamp(52px,13.5vw,65px);
  border-top:1px solid rgba(255,255,255,.05);
  padding:0 clamp(12px,3.2vw,16px);
}
.me:first-child{border-top:0}
.me-date{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:2px;padding-right:clamp(6px,1.8vw,9px);color:var(--muted);font-size:clamp(8px,2vw,9.5px);font-weight:700}
.me-date span{color:#58666f;font-size:.9em}
.me-sep{background:rgba(255,255,255,.07);margin:8px 0}
.me-teams{display:flex;flex-direction:column;justify-content:center;gap:clamp(3px,1vw,5px);padding:5px clamp(7px,2vw,10px)}
.me-team{display:flex;align-items:center;gap:clamp(6px,1.8vw,9px);font-size:clamp(10.5px,2.7vw,13px);font-weight:600;min-height:clamp(20px,5.2vw,25px)}
.me-team .crest{--cs:clamp(17px,4.4vw,21px)}
.me-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-team.dim{opacity:.4}
.me-score{display:flex;flex-direction:column;justify-content:center;gap:clamp(4px,1.2vw,6px);font-size:clamp(12px,3.1vw,15px);font-weight:800;font-variant-numeric:tabular-nums;text-align:center;padding:4px 0}
.me-score .dim{opacity:.4}
.me-bell{display:flex;align-items:center;justify-content:center;color:#2e4554;font-size:clamp(14px,3.7vw,18px)}
.sheet-verdict{margin:clamp(8px,2.4vw,12px) clamp(12px,3.2vw,16px) 0;background:#111a20;border-radius:9px;padding:clamp(8px,2.2vw,11px);font-size:clamp(9.5px,2.5vw,12px);font-weight:600;color:#b0bdc5;line-height:1.45}
.sheet-verdict b{color:#dde4e8}

/* â”€â”€ RESPONSIVE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */

}

/* â”€â”€ MÉRKŐZÉSEK FÜL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.matches-section{display:flex;flex-direction:column;gap:clamp(8px,2.2vw,12px)}
.round-card{background:var(--surface);border-radius:var(--card-r);overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.025)}
.round-header{
  padding:clamp(7px,1.9vw,10px) clamp(10px,2.6vw,14px);
  font-size:var(--fz-sm);font-weight:700;color:var(--muted2);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.round-comp{
  display:flex;align-items:center;gap:clamp(6px,1.8vw,9px);
  padding:clamp(5px,1.5vw,7px) clamp(10px,2.6vw,14px);
  border-bottom:1px solid rgba(255,255,255,.04);
  font-size:var(--fz-xs);color:var(--muted2);font-weight:600;
}
.round-comp .rc-logo{
  width:clamp(14px,3.6vw,18px);height:clamp(14px,3.6vw,18px);
  object-fit:contain;flex:0 0 auto;
}
.rc-sep{color:#454f57;margin:0 2px}
.match-row{
  display:grid;
  grid-template-columns:clamp(66px,17vw,88px) 1px 1fr clamp(34px,8.5vw,46px) clamp(28px,7vw,36px);
  align-items:stretch;
  min-height:clamp(72px,18vw,92px);
  border-top:1px solid rgba(255,255,255,.04);
}
.match-row:first-of-type{border-top:0}
.mr-date{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;
  gap:clamp(3px,1vw,5px);padding-right:clamp(8px,2.2vw,12px);
  color:#e8edf0;font-size:clamp(14px,3.7vw,19px);font-weight:900;font-variant-numeric:tabular-nums}
.mr-date span{color:#7f8c96;font-size:clamp(9.5px,2.5vw,12.5px);font-weight:800}
.mr-sep{background:rgba(255,255,255,.08);margin:10px 0}
.mr-teams{display:flex;flex-direction:column;justify-content:center;
  gap:clamp(6px,1.7vw,9px);padding:clamp(9px,2.4vw,13px) clamp(9px,2.6vw,14px)}
.mr-team{display:flex;align-items:center;gap:clamp(5px,1.5vw,7px);
  font-size:clamp(13px,3.35vw,17px);font-weight:760;
  min-height:clamp(26px,6.5vw,34px);color:#d8e1e6}
.mr-team.win{color:#e8edf0;font-weight:750}
.mr-team.dim{opacity:.45}
.mr-team .crest{--cs:clamp(24px,6.3vw,32px)}
.mr-tname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-scores{display:flex;flex-direction:column;justify-content:center;
  gap:clamp(6px,1.7vw,9px);padding:clamp(9px,2.4vw,13px) 0;
  font-size:clamp(14px,3.6vw,19px);font-weight:900;
  font-variant-numeric:tabular-nums;text-align:center;color:#c8d2d7}
.mr-scores .win{color:#e8edf0}
.mr-scores .dim{opacity:.45}
.mr-bell{display:flex;align-items:center;justify-content:center;
  color:#253540;font-size:clamp(13px,3.5vw,16px);padding-right:2px}

/* â”€â”€ MÉRKŐZÉSEK MOBIL FINOMHANGOLÁS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
@media (max-width: 520px){
  .main{padding-left:clamp(8px,2.4vw,12px);padding-right:clamp(8px,2.4vw,12px)}

  .round-comp .rc-logo{width:clamp(12px,3.1vw,15px);height:clamp(12px,3.1vw,15px)}

  }
  .mr-date{
    gap:clamp(2px,.7vw,4px);
    padding-right:clamp(5px,1.5vw,8px);

  }
  .mr-date span{font-size:clamp(7.5px,2vw,9.5px)}

  .mr-sep{margin:7px 0}
  .mr-teams{
    gap:clamp(4px,1.15vw,6px);

  }
  .mr-team{
    gap:clamp(4px,1.1vw,6px);
    font-size:clamp(10.5px,2.8vw,13px);
    min-height:clamp(20px,5.3vw,25px);

  }
  .mr-team .crest{--cs:clamp(17px,4.6vw,22px)}

  .mr-bell{font-size:clamp(10px,2.8vw,13px)}

  .standings .tname{

  }

  .standings .grid.short{grid-template-columns:20px minmax(0,1fr) 27px 36px 36px}

/* â”€â”€ STATISZTIKÁK â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.stat-kpi-row{display:flex;gap:clamp(8px,2.4vw,14px);margin-bottom:clamp(12px,3vw,18px)}
.stat-kpi{flex:1;background:#0a1015;border-radius:10px;padding:clamp(9px,2.4vw,13px);text-align:center}
.stat-kpi-val{font-size:clamp(18px,4.8vw,26px);font-weight:800;color:#e8edf0}
.stat-kpi-lbl{font-size:var(--fz-xs);color:var(--muted);margin-top:3px;font-weight:600}
.export-card{background:linear-gradient(180deg,rgba(39,201,106,.12),rgba(17,26,32,.98));border-color:rgba(39,201,106,.28)}
.export-copy{color:var(--muted);font-size:13px;font-weight:650;line-height:1.55;margin:0 0 14px}
.export-btn{width:100%;border:0;border-radius:10px;background:var(--green);color:#06110a;font-weight:900;font-size:14px;padding:13px 14px;cursor:pointer;box-shadow:0 10px 24px rgba(39,201,106,.16)}
.export-btn:active{transform:translateY(1px)}
.export-hint{color:#9eadb6;font-size:11px;font-weight:700;margin-top:10px}
.export-shell{max-width:1240px;margin:0 auto;padding:24px 12px 40px}.export-block{margin-bottom:26px}.export-block-title{font-size:22px;font-weight:900;color:#e8edf0;margin:0 0 12px;padding:0 2px}

.stat-section-title{font-size:var(--fz-sm);font-weight:700;color:var(--muted2);margin:clamp(10px,2.8vw,16px) 0 clamp(5px,1.4vw,8px)}
.stat-result-labels{display:flex;font-size:var(--fz-sm);color:#c8d2d7;font-weight:600;margin-bottom:4px}
.stat-bar-row{display:flex;align-items:center;gap:clamp(7px,2vw,10px);margin-bottom:clamp(8px,2.2vw,12px)}
.stat-bar-track{flex:1;height:clamp(7px,1.8vw,10px);background:#111a20;border-radius:99px;overflow:hidden}
